[project]
name = "test-triage-agent"
version = "0.1.0"
description = "Claude agent that triages failed test runs: product bug, test bug, flaky or environment."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
sample = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "pytest-playwright>=0.10.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"dataset/catalog.py" = ["E501"]  # code snippets are kept verbatim
